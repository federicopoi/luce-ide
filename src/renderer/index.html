<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'"><title>Orbit</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="styles.css"></head>
<body>
 <header class="titlebar"><div class="brand"><span id="brand-icon"></span><span>Orbit</span><span class="beta">LOCAL</span></div><div id="project-heading" class="project-heading">Your workspace</div><button id="search-shortcut" class="search-shortcut"><span>⌘ K</span> Search conversations</button><button id="layout-button" class="icon-button" aria-label="Change terminal layout" title="Terminal layout"></button></header>
 <div class="app-layout">
  <nav class="project-rail" aria-label="Projects"><div class="rail-label">PROJECTS</div><div id="projects"></div><button id="add-project" class="add-project"><span>＋</span><span>Add project</span></button></nav>
  <aside class="conversation-sidebar"><div class="project-summary"><div class="project-title-row"><h1 id="sidebar-title">Orbit</h1><button id="project-menu" class="icon-button" aria-label="Project options">⋯</button></div><div id="project-path" class="project-path">A place for your coding sessions</div></div><button id="new-conversation" class="new-conversation"><span>＋</span> New conversation</button><div class="search-field"><span id="search-icon"></span><input id="conversation-search" placeholder="Search conversations" aria-label="Search conversations"><kbd>⌘ K</kbd></div><div id="conversation-lists" class="conversation-lists"></div><div class="sidebar-footer"><button id="find-sessions"><span id="history-icon"></span><span>Find local sessions</span><span id="refresh-indicator">↻</span></button><div id="provider-status">Claude Code + Codex</div></div></aside>
  <main class="workspace"><div id="terminal-workspace" class="terminal-workspace"></div><section id="preview-workspace" class="preview-workspace" hidden><div class="browser-toolbar"><button id="back-to-terminal" aria-label="Back to terminal"><span>←</span> Back to terminal</button><form id="url-form"><span id="globe-icon"></span><input id="preview-url" placeholder="localhost:5173" aria-label="Website URL"></form><button id="reload-preview" class="icon-button" aria-label="Reload preview"></button><button id="expand-preview" class="icon-button" aria-label="Expand preview"></button></div><div id="browser-surface" class="browser-surface"><div id="preview-placeholder" class="preview-placeholder"><div class="preview-placeholder-icon">↗</div><h2>Website preview</h2><p>Run your dev server in a terminal, then click Preview.<br>Or enter a website URL above.</p></div></div><div id="preview-message" class="preview-message" hidden></div></section><footer class="statusbar"><div><span id="folder-icon"></span><span id="status-path">Orbit · Local workspace</span></div><div><span id="terminal-count"></span><span id="status-url"></span></div></footer></main>
 </div>
 <div id="popup" class="popup" hidden></div><div id="toast" class="toast" role="status" hidden></div>
 <dialog id="modal"><form id="modal-form"><div class="modal-heading"><h2 id="modal-title"></h2><button type="button" id="modal-close" class="icon-button" aria-label="Close dialog">×</button></div><div id="modal-content"></div><div id="modal-actions"><button type="button" id="modal-cancel">Cancel</button><button type="submit" id="modal-submit" class="primary">Save</button></div></form></dialog>
 <script src="app.js"></script>
</body></html>
